<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <input type="button" id="hider" value="Нажмиет, чтобы спрятать текст" />
        <div id="text">Текст</div>
        <script>
            const hider = document.getElementById("hider");
            const text = document.getElementById("text");
            function display() {
                text.style.display = 'none';
            }
            const disNone = () => {text.style.display = 'none'};
            hider.addEventListener("click", disNone);
            // hider.addEventListener("click", display);
            // hider.addEventListener("click", () => {text.style.display = 'none'});
        </script>
    </body>
</html>
